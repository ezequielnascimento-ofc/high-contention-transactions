spring:
  application:
    name: High Contention Transactions

springdoc:
  # Error responses are declared per operation (OpenApiConfig), not copied
  # from every @ExceptionHandler onto every endpoint.
  override-with-generic-response: false
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

inventory:
  concurrency:
    # atomic | pessimistic | optimistic | serializable
    strategy: atomic
    # Retrying strategies (optimistic, serializable) only
    max-attempts: 10
    base-backoff: 2ms
    max-backoff: 50ms

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
