<div class="max-w-4xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
  <div class="space-y-4">
    <app-load-config-panel (runRequested)="onRun($event)" />
    <app-run-summary [result]="result()" />
  </div>

  <div class="space-y-4">
    <app-live-stock-gauge [quantity]="liveQuantity()" [connected]="connected()" />
    <app-request-outcome-chart [result]="result()" [running]="running()" />
  </div>
</div>
