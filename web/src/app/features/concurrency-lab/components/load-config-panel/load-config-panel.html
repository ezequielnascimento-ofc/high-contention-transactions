<form [formGroup]="form" (ngSubmit)="onSubmit()" class="border rounded-lg p-4 bg-white space-y-3">
  <h3 class="font-semibold text-lg">Configurar teste de carga</h3>

  <div>
    <label class="block text-sm text-gray-600">ID do inventário</label>
    <input formControlName="inventoryId" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm text-gray-600">Requisições concorrentes</label>
    <input formControlName="requestCount" type="number" class="w-full border rounded px-3 py-2" />
    <div class="flex gap-2 mt-2">
      @for (preset of presets; track preset) {
        <button
          type="button"
          (click)="applyPreset(preset)"
          class="text-xs px-2 py-1 border rounded hover:bg-gray-50"
        >
          {{ preset }}
        </button>
      }
    </div>
  </div>

  <div>
    <label class="block text-sm text-gray-600">Quantidade por requisição</label>
    <input formControlName="decreaseAmount" type="number" class="w-full border rounded px-3 py-2" />
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50 w-full"
  >
    Disparar teste
  </button>
</form>
