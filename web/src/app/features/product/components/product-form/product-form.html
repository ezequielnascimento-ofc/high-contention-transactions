<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3 border rounded-lg p-4 bg-white">
  <h3 class="font-semibold text-lg">Novo produto</h3>

  <div>
    <label class="block text-sm text-gray-600">Nome</label>
    <input formControlName="name" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm text-gray-600">Descrição</label>
    <input formControlName="description" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm text-gray-600">Preço</label>
    <input
      formControlName="price"
      type="number"
      step="0.01"
      class="w-full border rounded px-3 py-2"
    />
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50"
  >
    Criar produto
  </button>
</form>
