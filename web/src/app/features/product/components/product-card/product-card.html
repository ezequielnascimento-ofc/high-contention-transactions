<div class="border rounded-lg p-4 shadow-sm bg-white">
  <div class="flex justify-between items-start">
    <div>
      <h3 class="font-semibold text-lg">{{ product().name }}</h3>
      <p class="text-gray-500 text-sm">{{ product().description || 'Sem descrição' }}</p>
    </div>
    <span
      class="text-xs px-2 py-1 rounded-full"
      [class.bg-green-100]="product().status === ProductStatus.ACTIVE"
      [class.text-green-700]="product().status === ProductStatus.ACTIVE"
      [class.bg-gray-100]="product().status === ProductStatus.INACTIVE"
      [class.text-gray-500]="product().status === ProductStatus.INACTIVE"
    >
      {{ product().status }}
    </span>
  </div>

  <p class="text-xl font-bold mt-3">R$ {{ product().price }}</p>

  <div class="text-xs text-gray-400 mt-2">ID: {{ product().id }}</div>

  <button
    (click)="activateToggled.emit()"
    class="mt-3 text-sm px-3 py-1 border rounded hover:bg-gray-50"
  >
    {{ product().status === ProductStatus.ACTIVE ? 'Desativar' : 'Ativar' }}
  </button>
</div>
