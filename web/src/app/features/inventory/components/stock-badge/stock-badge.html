<span
  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
  [class.bg-green-100]="quantity() > 10"
  [class.text-green-700]="quantity() > 10"
  [class.bg-yellow-100]="quantity() > 0 && quantity() <= 10"
  [class.text-yellow-700]="quantity() > 0 && quantity() <= 10"
  [class.bg-red-100]="quantity() === 0"
  [class.text-red-700]="quantity() === 0"
>
  {{ quantity() }} em estoque
</span>
