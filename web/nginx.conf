server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the production build calls /api on this host.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-Sent Events for the live stock gauge
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
