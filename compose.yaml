# One command: docker compose up --build
#   Concurrency Lab  http://localhost:4200
#   API              http://localhost:8080
#   PostgreSQL       localhost:5432 (DB_PORT=5433 docker compose up if 5432 is taken)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: highcontention
      POSTGRES_USER: highcontention
      POSTGRES_PASSWORD: highcontention
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highcontention -d highcontention"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/highcontention
      SPRING_DATASOURCE_USERNAME: highcontention
      SPRING_DATASOURCE_PASSWORD: highcontention
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build: ./web
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
